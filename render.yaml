services:
  - type: web
    name: medifind-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SUPPORT_EMAIL
        value: medifindofficial@gmail.com
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        # The native Android app calls the API directly and sends no Origin
        # header, so it's unaffected by this — set this to your deployed web
        # frontend's actual URL(s), comma-separated. Server refuses to boot
        # in production without this set (see backend/server.js).
        sync: false
