name: medifind-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # GROUP 1 — no dependencies, run in parallel
  # ═══════════════════════════════════════════════════════════════════════

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-web

      - name: npm audit — backend (fails the job on moderate+ vulnerabilities)
        run: npm audit --audit-level=moderate
        working-directory: backend

      - name: npm audit — frontend-web (fails the job on moderate+ vulnerabilities)
        run: npm audit --audit-level=moderate
        working-directory: frontend-web

      - name: Run custom security checks (secrets, .gitignore, JWT/CORS/reset-token guards)
        run: node scripts/security-review.js

  backend-api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medifind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medifind_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Apply Prisma migrations to the throwaway test database
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Run backend tests (backend/test + backend/tests — includes the mocked-Overpass findDoctor tests)
        run: npm test
        working-directory: backend

  web-unit-tests:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Run frontend unit tests (vitest)
        run: npm test
        working-directory: frontend-web

  build-web-app:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Build
        run: npm run build
        working-directory: frontend-web

      - name: Verify dist/ output exists
        run: |
          test -d frontend-web/dist || (echo "::error::frontend-web/dist was not produced by the build" && exit 1)
          test -f frontend-web/dist/index.html || (echo "::error::frontend-web/dist/index.html is missing" && exit 1)
          echo "Build output:" && ls -la frontend-web/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-dist
          path: frontend-web/dist/
          retention-days: 5

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-app

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app

      - name: Verify APK was produced
        run: |
          APK=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK found under android-app/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP 2 — depends on GROUP 1
  # ═══════════════════════════════════════════════════════════════════════

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [backend-api-tests]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medifind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medifind_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: 5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Start backend server in the background
        run: nohup node server.js > server.log 2>&1 &
        working-directory: backend

      - name: Wait for the server to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend never became healthy within 30s"
          cat backend/server.log || true
          exit 1

      - name: Run load test (50 concurrent /api/analyze requests + rate-limit check)
        run: node scripts/load-test.js
        env:
          BASE_URL: http://localhost:5000

      - name: Show backend server log (always, for debugging)
        if: always()
        run: cat backend/server.log || true

  web-e2e-tests:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    needs: [build-web-app, backend-api-tests]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medifind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medifind_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: 5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Start backend server in the background
        run: nohup node server.js > server.log 2>&1 &
        working-directory: backend

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::Backend never became healthy within 30s"
          cat backend/server.log || true
          exit 1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Build the web app pointed at the live test backend
        # A fresh build (not the build-web-app artifact) — that build has no
        # VITE_API_URL override, so its client would call the relative /api
        # path, which only resolves behind a reverse proxy in real
        # deployments, not against `vite preview`'s static server here.
        run: npm run build
        working-directory: frontend-web
        env:
          VITE_API_URL: http://localhost:5000

      - name: Serve the built app
        run: nohup npx vite preview --port 4173 --host --strictPort > preview.log 2>&1 &
        working-directory: frontend-web

      - name: Wait for the static server to become reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::Static preview server never became reachable within 30s"
          cat frontend-web/preview.log || true
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend-web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend-web
        env:
          E2E_BASE_URL: http://localhost:4173
          CI: true

      - name: Upload Playwright report (always, for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-web/playwright-report/
          retention-days: 5

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "── backend/server.log ──"; cat backend/server.log || true
          echo "── frontend-web/preview.log ──"; cat frontend-web/preview.log || true

  verify-live-web-deployment:
    name: Verify Live Web Deployment
    runs-on: ubuntu-latest
    needs: [build-web-app]
    timeout-minutes: 5
    steps:
      - name: Curl DEPLOY_URL if set, otherwise skip gracefully
        run: |
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "DEPLOY_URL is not set — skipping live deployment check (this is not a failure)."
            exit 0
          fi
          echo "Checking $DEPLOY_URL ..."
          status=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
          echo "Received HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Live deployment at $DEPLOY_URL returned $status, expected 200"
            exit 1
          fi
          echo "✅ Live deployment is reachable and returned 200."
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}

  # ═══════════════════════════════════════════════════════════════════════
  # GROUP 3 — depends on GROUP 2
  # ═══════════════════════════════════════════════════════════════════════

  android-appium-e2e:
    name: Android Appium E2E
    runs-on: ubuntu-latest
    needs: [build-android-apk]
    timeout-minutes: 10
    steps:
      - name: Check for self-hosted Android emulator infrastructure
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ -n "${ANDROID_EMULATOR_AVAILABLE:-}" ]; then
            echo "Self-hosted Android emulator detected — Appium E2E would run here."
            echo "(No self-hosted runner is currently configured for this repo; add one and"
            echo " set ANDROID_EMULATOR_AVAILABLE=1 on it to enable real Appium E2E runs.)"
          else
            echo "::notice::Skipping Android Appium E2E — no self-hosted runner with an Android emulator is configured."
            echo "This is expected on GitHub-hosted runners and does NOT fail the pipeline."
          fi

  unified-summary:
    name: Unified Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security-review
      - backend-api-tests
      - web-unit-tests
      - build-web-app
      - build-android-apk
      - load-tests
      - web-e2e-tests
      - verify-live-web-deployment
      - android-appium-e2e
    steps:
      - name: Build summary table
        run: |
          {
            echo "## MediFind CI — Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Security Review | ${{ needs.security-review.result }} |"
            echo "| Backend API Tests | ${{ needs.backend-api-tests.result }} |"
            echo "| Web Unit Tests | ${{ needs.web-unit-tests.result }} |"
            echo "| Build Web App | ${{ needs.build-web-app.result }} |"
            echo "| Build Android APK | ${{ needs.build-android-apk.result }} |"
            echo "| Load Tests | ${{ needs.load-tests.result }} |"
            echo "| Web E2E Tests | ${{ needs.web-e2e-tests.result }} |"
            echo "| Verify Live Web Deployment | ${{ needs.verify-live-web-deployment.result }} |"
            echo "| Android Appium E2E | ${{ needs.android-appium-e2e.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the summary job if any REQUIRED job failed
        # android-appium-e2e is deliberately excluded — it self-skips when no
        # emulator infra exists, which is expected, not a failure.
        run: |
          for result in \
            "${{ needs.security-review.result }}" \
            "${{ needs.backend-api-tests.result }}" \
            "${{ needs.web-unit-tests.result }}" \
            "${{ needs.build-web-app.result }}" \
            "${{ needs.build-android-apk.result }}" \
            "${{ needs.load-tests.result }}" \
            "${{ needs.web-e2e-tests.result }}" \
            "${{ needs.verify-live-web-deployment.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
